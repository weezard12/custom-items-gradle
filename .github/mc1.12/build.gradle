plugins { id 'java' }

allprojects {
    apply plugin: 'java'

    group = 'nl.knokko.customitems'

    repositories {
        mavenLocal()
        mavenCentral {
            content {
                includeGroup 'junit'
                includeGroup 'org.hamcrest'
                includeGroup 'com.github.cliftonlabs'
            }
        }
    }
}

project(':shared-code') {
    dependencies {
        implementation project(':bit-helper')
        implementation 'com.github.cliftonlabs:json-simple:4.0.1'
    }
    sourceSets.test.java.setSrcDirs([])
    sourceSets.test.resources.setSrcDirs([])
}

project(':kci-nms') {
    dependencies {
        compileOnly project(':shared-code')
        compileOnly 'org.bukkit:bukkit:1.12.2-R0.1-SNAPSHOT'
    }
}

project(':kci-nms12') {
    dependencies {
        compileOnly project(':kci-nms')
        compileOnly 'org.bukkit:craftbukkit:1.12.2-R0.1-SNAPSHOT'
    }
}
